name: Generate Release Info

on:
  release:
    types: [published, edited] # edited does not trigger if it's not published yet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'shopwell-shop/shopwell'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4

      - name: Generate Release Info
        run: |
          mkdir generated
          cd generated
          deno run --allow-read --allow-write --allow-net --allow-env ../.github/release_info_generator.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: eu-west-1
          role-session-name: github-actions
          role-to-assume: ${{ secrets.CHANGELOG_UPDATE_ROLE_ARN }}

      - name: AWS Deploy
        run: aws s3 sync generated s3://releases.s3.shopwell.com/changelog

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ECVXLYHJ64DVV --paths "/changelog/*"

      - uses: shopwell-shop/octo-sts-action@ace087b5b8331bebfb452c74fdc94e3e2555c79b
        if: github.event.action == 'published'
        id: sts-production
        with:
          scope: shopwell-shop/template
          identity: release

      - name: Trigger shopwell/template build
        if: github.event.action == 'published'
        continue-on-error: true
        run: |
          curl \
          -X POST \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: Bearer ${{ steps.sts-production.outputs.token }}" \
          -H "Content-Type: application/json" \
          https://api.github.com/repos/shopwell-shop/template/actions/workflows/update.yml/dispatches \
          -d '{"ref": "trunk"}'
