name: ZUGFeRD Compliance

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "tests/integration/Core/Checkout/Document/Renderer/_snapshots/**"
      - "tests/integration/Core/Checkout/DocumentV2/Renderer/_snapshots/**"
      - ".github/bin/js/zugferd-compliance.ts"
      - ".github/workflows/zugferd-compliance.yml"

permissions:
  contents: read

concurrency:
  group: zugferd-compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zugferd-compliance:
    name: ZUGFeRD compliance
    runs-on: ubuntu-24.04
    if: github.repository == 'shopwell-shop/shopwell' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Run ZUGFeRD compliance check
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORK_DIR: ${{ runner.temp }}/zugferd
        run: node ./.github/bin/js/zugferd-compliance.ts

      - name: Upload validation reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zugferd-compliance-reports
          path: ${{ runner.temp }}/zugferd/reports
          if-no-files-found: ignore
