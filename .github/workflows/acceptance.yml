name: Acceptance tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      profile:
        description: "Run profile: '' (PR), 'nightly' or 'release' (patch release gate)"
        default: ""
      major:
        description: "Filter major variants: '' (all), 'exclude' (non-major only), 'only' (major only)"
        default: ""
      currents:
        description: 'Report to currents?'
        type: boolean
        default: false
  workflow_call:
    inputs:
      profile:
        type: string
        default: ""
      major:
        type: string
        default: ""
      currents:
        description: 'Report to currents?'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  markdown-only-changes:
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        uses: ./.github/actions/markdown-only-changes

  generate-acceptance-matrix:
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: generate-matrix
        run: |
          # PR major runs enter through acceptance-major.yml with major: only. Keep this
          # ordinary PR/merge-queue matrix independent of labels to avoid duplicate major runs.
          MATRIX=$(php .github/bin/generate-acceptance-matrix.php "${{ inputs.profile }}" "false" "${{ inputs.major }}")
          jq . <<<"$MATRIX"
          {
            echo "matrix<<EOF"
            echo "$MATRIX"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  acceptance:
    runs-on: ubuntu-24.04
    env:
      V6_8_0_0: ${{ matrix.major && '1' || '' }}
    permissions:
      contents: read
      id-token: write
    # Shards finish in under 20 minutes; without a cap a single hung step holds the job for GitHub's 6-hour default.
    timeout-minutes: 40
    needs: generate-acceptance-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-acceptance-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ats
        with:
          project: ${{ matrix.name }}
          php-version: ${{ matrix.php-version }}
          shard: ${{ matrix.shard }}
          shard-count: ${{ matrix.shard-count }}
          workers: 4
          major: ${{ matrix.major }}
          install: ${{ matrix.name != 'Install' && 'true' || 'false' }}
          extra-options: ${{ matrix.name == 'Install' && '--trace=on' || '' }}
          use-currents: ${{ inputs.currents && matrix.no-currents != 'true' && 'true' || '' }}
          currents-project-id: ${{ secrets.CURRENTS_PROJECT_ID }}
          currents-record-key: ${{ secrets.CURRENTS_RECORD_KEY }}
          playwright-role-arn: ${{ secrets.PLAYWRIGHT_TRACES_UPLOAD_ROLE_ARN }}
          playwright-traces-domain: ${{ vars.PLAYWRIGHT_TRACES_DOMAIN }}
          s3-bucket: shopwell-ci-playwright-traces
          report-prefix: playwright-reports

  acceptance-status-check:
    runs-on: ubuntu-24.04
    needs: acceptance
    if: ${{ !cancelled() && inputs.profile == 'nightly' }}
    permissions:
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report acceptance status to Slack
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SLACK_ATS_WORKFLOW_URL: ${{ secrets.SLACK_ATS_WORKFLOW_URL }}
          RUN_LABEL: ${{ inputs.major == 'only' && 'Major' || '' }}
        run: .github/bin/acceptance-slack-status.bash

  acceptance-code-style:
    name: Acceptance code style
    if: ${{ inputs.major != 'only' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/acceptance/package-lock.json

      - name: Install npm
        run: npm install -g npm@11.8.0

      - name: Install dependencies
        uses: shopwell-shop/github-actions/npm-ci-retry@51511121da3f6239e5df7cd307428aac88d728d1
        with:
          working-directory: tests/acceptance

      - name: Lint
        working-directory: tests/acceptance
        run: npm run lint

      - name: Format
        working-directory: tests/acceptance
        run: npm run format

  acceptance-tests-changed:
    permissions:
      contents: read
      id-token: write
    needs:
      - markdown-only-changes
    if: ${{ needs.markdown-only-changes.outputs.docs_only != 'true' && inputs.major != 'only' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full history in order to see what's changed

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            tests/acceptance/tests/**/*.spec.ts

      - name: Execute acceptance tests
        if: ${{ steps.changed-files.outputs.any_changed == 'true' }}
        uses: ./.github/actions/ats
        #env:
        #  ATS_SKIP_CLEANUP: true
        with:
          project: "Platform"
          install: true
          extra-options: >-
            --repeat-each="10" -x ${{ format(' {0}', steps.changed-files.outputs.all_changed_files) }}
          artifact-prefix: "ats-changed"

  # this allows us to specify just one required job/check
  # this is not practical with matrix jobs directly, because you've to specify all permutations
  acceptance-check:
    name: ${{ inputs.major == 'only' && github.event_name == 'pull_request' && 'acceptance-major-check' || 'acceptance-check' }}
    if: always()
    needs:
      - acceptance-code-style
      - markdown-only-changes
      - acceptance

    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          # allow markdown-only PRs to skip the expensive jobs, and the major-only nightly to skip
          # the jobs that are irrelevant to it, but fail on unexpected skips otherwise
          allowed-skips: >-
            ${{ inputs.major == 'only' && (needs.markdown-only-changes.outputs.docs_only == 'true'
                && 'acceptance-code-style, acceptance' || 'acceptance-code-style')
              || (needs.markdown-only-changes.outputs.docs_only == 'true' && 'acceptance' || '') }}
          jobs: ${{ toJSON(needs) }}
