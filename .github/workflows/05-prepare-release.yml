name: Prepare release

on:
  workflow_dispatch:
    inputs:
      skip_recipe_check:
        description: "Skip the external recipe nightly gate for a bootstrap release"
        required: false
        default: false
        type: boolean
      release_version:
        description: "Stable version to publish when dispatching from a branch"
        required: false
        default: ""
        type: string
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.repository == 'shopwell-shop/shopwell'
    env:
      SHOPWELL_ADMIN_SKIP_SOURCEMAP_GENERATION: "1"
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/root
      COMPOSER_ROOT_VERSION: 6.7.9999999-dev
      APP_URL: http://localhost:8000
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: root
        options: '--mount="type=tmpfs,destination=/var/lib/mysql" --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=2s --health-retries=3'
        ports:
          - "3306:3306"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: 8.2
          coverage: none
          extensions: gd, xml, dom, curl, pdo, mysqli, mbstring, pdo_mysql, bcmath

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: build shopwell
        run: |
          # Composer validates path repositories before lifecycle scripts run.
          # Keep the optional plugin roots present for a clean checkout.
          mkdir -p custom/plugins custom/static-plugins
          composer setup

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: context
          include-hidden-files: true
          path: |
            .
            !.git
            .github/
            !var/cache
            !tests/
            !public
            !**/node_modules
            !vendor
            !vendor-bin

  check-recipe:
    runs-on: ubuntu-24.04
    if: github.repository == 'shopwell-shop/shopwell' && (inputs.release_version != '' || github.ref_type == 'tag') && !inputs.skip_recipe_check
    env:
      GH_TOKEN: ${{ github.token }}
      CHECK_REPOSITORY: "shopwell-shop/recipes"
      CHECK_WORKFLOW: "nightly.yml"
      CHECK_STATUS: "success"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether the nightly workflow of the recipe repository is successful
        run: |
          bash .github/bin/check_workflow.bash "${CHECK_REPOSITORY}" "${CHECK_WORKFLOW}" "${CHECK_STATUS}"

  split:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ format('manyrepos_{0}', inputs.release_version != '' && 'tag' || github.ref_type) }}
    # we use this image to get an older git version, which does not suffer from a performance regression
    container: node:lts-alpine3.19
    if: github.repository == 'shopwell-shop/shopwell'
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package:
          - administration
          - storefront
          - core
          - elasticsearch
    env:
      GIT_AUTHOR_EMAIL: "shopwellbot@shopwell.com"
      GIT_AUTHOR_NAME: "shopwellBot"
      GIT_COMMITTER_EMAIL: "shopwellbot@shopwell.com"
      GIT_COMMITTER_NAME: "shopwellBot"
      DEBUG: ${{ github.event.act && '1' || '' }}
      SHOPWELL_SPLIT_TOKEN: ${{ secrets.SHOPWELL_SPLIT_TOKEN }}
    steps:
      - name: install deps
        run: apk add git git-subtree bash composer

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: context

      - name: Validate split repository token
        run: |
          if [ -z "${SHOPWELL_SPLIT_TOKEN}" ]; then
            echo "SHOPWELL_SPLIT_TOKEN is required to publish split repositories" >&2
            exit 1
          fi

      - name: Is protected
        if: github.ref_protected
        run: echo 'is protected'

      - name: Mark dir as safe
        run: git config --global --add safe.directory "$PWD"

      - name: split
        run: |
          bash .github/bin/split.bash split_repo "${{ matrix.package }}"
          git config --global --add safe.directory "$PWD/repos/${{ matrix.package }}"
          rm -Rf .git

      - name: Include assets
        run: |
          bash .github/bin/split.bash include_assets "${{ matrix.package }}"

      - name: Require core version
        run: |
          bash .github/bin/split.bash require_core_version "${{ matrix.package }}" "${{ inputs.release_version || github.ref_name }}" tag

      - name: Commit assets
        if: matrix.package != 'core'
        run: |
          bash .github/bin/split.bash commit "${{ matrix.package }}" "${{ inputs.release_version || github.ref_name }} (+ assets)"

      - name: Tag commit
        if: inputs.release_version != '' || github.ref_type == 'tag'
        run: |
          bash .github/bin/split.bash tag "${{ matrix.package }}" "${{ inputs.release_version || github.ref_name }}"

      - name: Diff
        if: matrix.package != 'core'
        run: |
          cat repos/${{ matrix.package }}/composer.json
          git -C repos/${{ matrix.package }} log -n 2
          git -C repos/${{ matrix.package }} diff @^.. | head -n 100

      - name: Create temporary branch
        if: inputs.release_version == '' && github.ref_type != 'tag' && !github.ref_protected
        run: |
          bash .github/bin/split.bash branch "${{ matrix.package }}" "tmp-${{ github.sha }}"

      - name: Create named branch
        if: inputs.release_version == '' && github.ref_type != 'tag' && github.ref_protected
        run: |
          bash .github/bin/split.bash branch "${{ matrix.package }}" "${{ github.ref_name }}"

      - name: Push
        if: inputs.release_version != '' || github.ref_type == 'tag' || github.ref_protected
        run: |
          bash .github/bin/split.bash push "${{ matrix.package }}" "https://x-access-token:${SHOPWELL_SPLIT_TOKEN}@github.com/shopwell-shop" "${{ inputs.release_version || github.ref_name }}"

      - name: Push temporary branch
        if: inputs.release_version == '' && github.ref_type != 'tag' && !github.ref_protected && !env.ACT
        run: |
          bash .github/bin/split.bash push "${{ matrix.package }}" "https://x-access-token:${SHOPWELL_SPLIT_TOKEN}@github.com/shopwell-shop" "tmp-${{ github.sha }}"

  draft-release-notes:
    needs: split
    runs-on: ubuntu-24.04
    if: github.repository == 'shopwell-shop/shopwell'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # set dry run if it's not a tag
          DRY_RUN: ${{ inputs.release_version == '' && github.ref_type != 'tag' && '1' || '' }}
        run: |
          echo DRY_RUN: "${DRY_RUN}"
          bash .github/bin/create_github_release.bash draft "${{ inputs.release_version || github.ref_name }}"

  create-sbp-release:
    needs: split
    runs-on: ubuntu-24.04
    if: github.repository == 'shopwell-shop/shopwell'
    strategy:
      matrix:
        sbp-environment: [STAGING, PRODUCTION]
    env:
      SBP_API_URL: ${{ secrets[format('SBP_API_URL_{0}', matrix.sbp-environment)] }}
      SBP_TOKEN: ${{ secrets[format('SBP_API_TOKEN_{0}', matrix.sbp-environment)] }}
      # set dry run if it's not a tag
      DRY_RUN: ${{ inputs.release_version == '' && github.ref_type != 'tag' && '1' || '' }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create sbp release
        run: |
          echo DRY_RUN: "${DRY_RUN}"
          bash .github/bin/sbp_release.bash create "${{ inputs.release_version || (github.ref_type == 'tag' && github.ref_name || 'v6.7.9999999.9999999-dev') }}"

  update-milestones:
    needs: split
    runs-on: ubuntu-24.04
    if: github.repository == 'shopwell-shop/shopwell' && (inputs.release_version != '' || github.ref_type == 'tag')
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: npm ci --prefix .github/bin/js/
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TAG: ${{ inputs.release_version || github.ref_name }}
          DRY_RUN: ${{ vars.UPDATE_MILESTONES_DRY_RUN || 'true' }}
        with:
          script: |
            const { updateMilestonesOnRelease } = await import('${{ github.workspace }}/.github/bin/js/node_modules/@shopwell-ag/gh-project-automation/dist/index.mjs')
            await updateMilestonesOnRelease({github, core, context, fetch})
