repository-url: https://raw.githubusercontent.com/shopwell/translations/main/translations
metadata-url: https://raw.githubusercontent.com/shopwell/translations/main/crowdin-metadata.json

excluded-locales: ['it-IT']

plugins: [
    'PluginPublisher',
    'SwagCmsExtensions',
    'SwagCommercial',
    'SwagPayPal',
]

plugin-mapping:
    - plugin: 'SwagPublisher'
      name: 'PluginPublisher'

languages:
    - name: 'Dansk'
      locale: 'da-DK'
    - name: '简体中文'
      locale: 'zh-CN'
    - name: 'English (UK)'
      locale: 'en-GB'
    - name: 'English (US)'
      locale: 'en-US'
    - name: 'Español'
      locale: 'es-ES'
    - name: 'Français'
      locale: 'fr-FR'
    - name: 'Hrvatski'
      locale: 'hr-HR'
    - name: 'Magyar'
      locale: 'hu-HU'
    - name: 'Bahasa Indonesia'
      locale: 'id-ID'
