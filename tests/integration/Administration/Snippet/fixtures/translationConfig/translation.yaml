repository-url: 'http://localhost:8000'
metadata-url: https://raw.githubusercontent.com/shopwell/translations/main/crowdin-metadata.json

locales:
    - en-GB
    - zh-CN
    - es-ES

plugins:
    - activePlugin
    - testPlugin

languages:
    - locale: en-GB
      name: English (UK)
    - locale: zh-CN
      name: 简体中文
    - locale: es-ES
      name: Español

plugin-mapping:
    - plugin: TestPlugin
      name: activePlugin
